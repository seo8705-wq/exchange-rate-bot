name: Auto Exchange Rate Bot

on:
  schedule:
    - cron: '30 0 * * 1-5'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Exchange Collector
        run: |
          python main.py

      - name: Commit & Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f exchange_rates.csv ]; then
            git add exchange_rates.csv
            git commit -m "Auto-update exchange rate: $(date +'%Y-%m-%d %H:%M')" || echo "No changes to commit"
            git push
          else
            echo "exchange_rates.csv 파일이 생성되지 않았습니다."
            exit 1
          fi
